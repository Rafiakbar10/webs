<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulasi Cicilan HCI - WhatsApp</title>
    <style>
        body {
            background-color: #0b141a;
            color: #e9edef;
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        .wa-header {
            background-color: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #222d34;
            position: fixed;
            top: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 100;
        }
        .wa-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #e65c00, #f9d423);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 15px;
            color: white;
            margin-right: 12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }
        .wa-info h3 {
            margin: 0;
            font-size: 16px;
            color: #e9edef;
            font-weight: 500;
        }
        .wa-info p {
            margin: 2px 0 0 0;
            font-size: 12px;
            color: #00a884;
            font-weight: 500;
        }
        .wa-chat-container {
            flex: 1;
            margin-top: 62px;
            margin-bottom: 70px;
            padding: 15px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #0b141a;
            background-image: radial-gradient(#111b21 1.2px, transparent 1.2px);
            background-size: 24px 24px;
            max-width: 750px;
            width: 100%;
            align-self: center;
            box-sizing: border-box;
        }
        .message {
            max-width: 82%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 14.5px;
            line-height: 1.5;
            word-wrap: break-word;
            position: relative;
            white-space: pre-wrap;
            box-shadow: 0 1px 1px rgba(0,0,0,0.2);
        }
        .message.bot {
            background-color: #202c33;
            color: #e9edef;
            align-self: flex-start;
            border-top-left-radius: 0;
            border-left: 4px solid #00a884;
        }
        .message.user {
            background-color: #005c4b;
            color: #e9edef;
            align-self: flex-end;
            border-top-right-radius: 0;
        }
        .message-meta {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            margin-top: 4px;
            float: right;
            margin-left: 12px;
        }
        .time {
            font-size: 11px;
            color: #8696a0;
        }
        .check-icon {
            font-size: 13px;
            color: #53bdeb;
            font-weight: bold;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
        }
        .wa-btn {
            background-color: #005c4b;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }
        .wa-btn:hover { background-color: #006c58; }
        .wa-btn.whatsapp { background-color: #00a884; font-weight: 600; }
        .wa-btn.whatsapp:hover { background-color: #009072; }
        
        .emoji-picker {
            position: absolute;
            bottom: 75px;
            left: 15px;
            background-color: #202c33;
            border: 1px solid #2a3942;
            border-radius: 12px;
            padding: 10px;
            display: none;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 200;
        }
        .emoji-item {
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
            padding: 5px;
            border-radius: 6px;
        }
        .emoji-item:hover { background-color: #2a3942; }

        .wa-input-area {
            background-color: #202c33;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 12px;
            position: fixed;
            bottom: 0;
            width: 100%;
            box-sizing: border-box;
            max-width: 750px;
            left: 50%;
            transform: translateX(-50%);
            border-top: 1px solid #222d34;
        }
        .wa-input-area .icon-btn {
            background: none;
            border: none;
            color: #8696a0;
            font-size: 22px;
            cursor: pointer;
            padding: 0;
        }
        .wa-input-area input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            color: white;
            font-size: 15px;
            outline: none;
        }
        .wa-input-area input::placeholder { color: #8696a0; }
        .wa-input-area .send-btn {
            background-color: #00a884;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="wa-header">
        <div class="wa-avatar">HCI</div>
        <div class="wa-info">
            <h3>Simulasi Cicilan HCI</h3>
            <p>online</p>
        </div>
    </div>

    <div class="emoji-picker" id="emojiPicker">
        <button class="emoji-item" onclick="addEmoji('😊')">😊</button>
        <button class="emoji-item" onclick="addEmoji('👍')">👍</button>
        <button class="emoji-item" onclick="addEmoji('🔥')">🔥</button>
        <button class="emoji-item" onclick="addEmoji('⭐')">⭐</button>
        <button class="emoji-item" onclick="addEmoji('🤝')">🤝</button>
        <button class="emoji-item" onclick="addEmoji('📱')">📱</button>
        <button class="emoji-item" onclick="addEmoji('💻')">💻</button>
        <button class="emoji-item" onclick="addEmoji('💸')">💸</button>
        <button class="emoji-item" onclick="addEmoji('✨')">✨</button>
        <button class="emoji-item" onclick="addEmoji('🙏')">🙏</button>
    </div>

    <div class="wa-chat-container" id="chatContainer">
        <div class="message bot">
            ✨ <b>{{ salam }}</b> ✨<br><br>
            🏢 <b>HOME CREDIT INDONESIA</b><br><br>
            📦 Silakan ketik dan kirimkan <b>Harga Barang</b> yang ingin anda hitung:<br><br>
            <i>(Contoh: 3.500.000 atau 3500000)</i>
            <div class="message-meta">
                <span class="time" id="initialTime"></span>
            </div>
        </div>
    </div>

    <div class="wa-input-area">
        <button type="button" class="icon-btn" onclick="toggleEmojiPicker(event)">😊</button>
        <button type="button" class="icon-btn" onclick="showInfoAttach()">📎</button>
        <input type="text" id="userInput" placeholder="Ketik pesan" autocomplete="off">
        <button type="button" class="send-btn" onclick="sendMessage()">➤</button>
    </div>

    <script>
        let step = 'GET_PRICE';
        let dataSimulasi = { harga: 0, dp: 0, tenor: 0 };

        function getCurrentTime() {
            return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }

        document.getElementById('initialTime').innerText = getCurrentTime();

        const inputField = document.getElementById('userInput');
        inputField.addEventListener("keypress", function(event) {
            if (event.key === "Enter") { sendMessage(); }
        });

        function toggleEmojiPicker(e) {
            e.stopPropagation();
            const picker = document.getElementById('emojiPicker');
            picker.style.display = picker.style.display === 'grid' ? 'none' : 'grid';
        }

        function addEmoji(emoji) {
            inputField.value += emoji;
            document.getElementById('emojiPicker').style.display = 'none';
            inputField.focus();
        }

        function showInfoAttach() {
            alert("ℹ️ Menu Lampiran (📎):\nSilakan ketik nominal Harga Barang atau DP secara langsung pada kolom chat.");
        }

        document.addEventListener('click', function(e) {
            const picker = document.getElementById('emojiPicker');
            if (!e.target.closest('.emoji-picker') && !e.target.closest('.icon-btn')) {
                picker.style.display = 'none';
            }
        });

        function appendMessage(text, sender, htmlButtons = '') {
            const container = document.getElementById('chatContainer');
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;
            
            if(sender === 'bot') {
                msgDiv.innerHTML = text + htmlButtons;
                const meta = document.createElement('div');
                meta.className = 'message-meta';
                meta.innerHTML = `<span class="time">${getCurrentTime()}</span>`;
                msgDiv.appendChild(meta);
            } else {
                msgDiv.innerText = text;
                const meta = document.createElement('div');
                meta.className = 'message-meta';
                meta.innerHTML = `<span class="time">${getCurrentTime()}</span><span class="check-icon">✓✓</span>`;
                msgDiv.appendChild(meta);
            }

            container.appendChild(msgDiv);
            container.scrollTop = container.scrollHeight;
        }

        async function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            appendMessage(text, 'user');
            inputField.value = '';
            document.getElementById('emojiPicker').style.display = 'none';

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ step: step, text: text, data: dataSimulasi })
                });
                const result = await response.json();

                step = result.next_step;
                dataSimulasi = result.data;

                if(result.loading) {
                    appendMessage("🔄 <i>Sedang menghitung rincian simulasi terbaik untuk Anda...</i>", 'bot');
                    setTimeout(() => {
                        const container = document.getElementById('chatContainer');
                        container.removeChild(container.lastChild);
                        appendMessage(result.reply, 'bot', result.buttons);
                        if(result.reset) {
                            step = 'GET_PRICE';
                            dataSimulasi = { harga: 0, dp: 0, tenor: 0 };
                        }
                    }, 1200);
                } else {
                    appendMessage(result.reply, 'bot', result.buttons);
                }

            } catch (error) {
                appendMessage("⚠️ Terjadi kesalahan koneksi.", 'bot');
            }
        }
    </script>
</body>
  </html>
